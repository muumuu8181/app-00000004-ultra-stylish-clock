<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050b1d"><title>LUMINA — 星晶の陣</title><style>
:root{color-scheme:dark;--bg:#050b1d;--panel:rgba(10,20,45,.78);--line:rgba(175,225,255,.16);--blue:#42d8ff;--gold:#ffb84d;--ink:#f5fbff;--muted:#91a8c4;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#183666 0,#08132d 34%,#040916 72%);color:var(--ink);overflow-x:hidden}body{min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center}.stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;content:"";background-image:radial-gradient(#fff 1px,transparent 1px);background-size:57px 57px;opacity:.13;animation:drift 26s linear infinite}.stars:before{background-size:91px 91px;transform:translate(15px,22px);opacity:.15;animation-duration:41s}.stars:after{background-size:131px 131px;transform:translate(43px,31px);opacity:.22;animation-duration:59s}@keyframes drift{to{background-position:240px 240px}}button,select{font:inherit}.app{width:min(100%,560px);position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 210deg,#45dfff,#735bff,#ffb657,#45dfff);box-shadow:0 0 34px rgba(72,207,255,.35);position:relative}.logo:after{content:"✦";position:absolute;inset:3px;border-radius:11px;display:grid;place-items:center;background:#081228;font-size:23px}.title{font-weight:900;letter-spacing:.18em;font-size:19px}.sub{font-size:10px;color:var(--muted);letter-spacing:.16em;margin-top:2px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font-size:19px;backdrop-filter:blur(15px)}.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(15,31,65,.9),rgba(6,14,34,.88));border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(18px)}.setup{padding:15px;margin-bottom:11px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:rgba(0,0,0,.25);border-radius:15px}.seg button{border:0;border-radius:11px;padding:10px;color:var(--muted);background:transparent;font-weight:800}.seg button.on{color:#06101f;background:linear-gradient(135deg,#dffaff,#6ee7ff);box-shadow:0 6px 22px rgba(65,210,255,.25)}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.select{border:1px solid var(--line);border-radius:14px;padding:9px 11px;background:rgba(0,0,0,.22)}.select span{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.select select{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:800}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px;margin-bottom:10px}.side{display:flex;align-items:center;gap:9px}.side.r{justify-content:flex-end;text-align:right}.gem{width:31px;height:31px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 0 20px currentColor}.gem:before{content:"";position:absolute;inset:6px;clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%);background:linear-gradient(145deg,#fff,currentColor 38%,rgba(0,0,0,.25))}.blue{color:var(--blue);background:rgba(66,216,255,.25)}.gold{color:var(--gold);background:rgba(255,184,77,.25)}.pname{font-size:10px;color:var(--muted)}.num{font-size:24px;font-weight:900;line-height:1}.turn{text-align:center;min-width:112px}.turn b{display:block;font-size:12px}.turn span{font-size:9px;color:var(--muted)}.thinking:after{content:"…";animation:dots 1s steps(4,end) infinite}@keyframes dots{0%{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}.boardwrap{padding:10px;position:relative}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px;border-radius:20px;background:linear-gradient(145deg,#0b1b3c,#050c1d);box-shadow:inset 0 0 40px rgba(42,132,211,.16)}.cell{position:relative;border:1px solid rgba(149,210,255,.1);border-radius:15px;background:radial-gradient(circle at 35% 25%,rgba(101,187,255,.11),rgba(5,14,34,.78));padding:0;min-width:0;overflow:visible}.cell:active{transform:scale(.94)}.cell.block{background:linear-gradient(145deg,#18213a,#070b14);border-color:rgba(255,255,255,.04)}.cell.block:after{content:"◆";position:absolute;inset:0;display:grid;place-items:center;color:#263451;font-size:clamp(15px,5vw,28px);text-shadow:0 1px rgba(255,255,255,.1)}.piece{position:absolute;inset:12%;border-radius:50%;transform:translateZ(0);animation:pop .23s cubic-bezier(.2,1.5,.4,1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.34),inset 0 -7px 12px rgba(0,0,0,.2),0 7px 15px rgba(0,0,0,.36),0 0 18px currentColor}.piece:before{content:"";position:absolute;inset:14%;clip-path:polygon(50% 0,88% 20%,100% 62%,72% 100%,28% 100%,0 62%,12% 20%);background:linear-gradient(145deg,#fff 0,currentColor 31%,rgba(255,255,255,.35) 58%,rgba(0,0,0,.3) 100%)}.piece:after{content:"";position:absolute;left:25%;top:17%;width:22%;height:13%;border-radius:50%;background:#fff;filter:blur(1px);opacity:.85}.piece.b{color:var(--blue);background:#168fbd}.piece.g{color:var(--gold);background:#d47925}@keyframes pop{from{transform:scale(.1) rotate(-50deg);opacity:0}to{transform:scale(1)}}.cell.selected{outline:2px solid #fff;outline-offset:2px;z-index:2}.cell.legal:before{content:"";position:absolute;inset:32%;border-radius:50%;background:rgba(127,237,255,.7);box-shadow:0 0 18px #49dfff;animation:pulse 1s infinite}.cell.jump:before{background:transparent;border:2px solid rgba(255,215,129,.9);box-shadow:0 0 16px #ffb84d}.cell.hint{animation:hint .7s 2}@keyframes pulse{50%{transform:scale(.65);opacity:.45}}@keyframes hint{50%{box-shadow:inset 0 0 0 4px #fff,0 0 28px #fff}}.flash{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:24px}.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 11px currentColor;animation:fly .65s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.ctl{border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);padding:10px 4px;font-weight:800;font-size:11px}.ctl span{display:block;font-size:18px;margin-bottom:3px}.ctl:disabled{opacity:.35}.primary{grid-column:span 2;background:linear-gradient(135deg,#d7f9ff,#57ddff);color:#06101f;border:0}.status{text-align:center;margin:10px 0 5px;font-size:11px;color:var(--muted);min-height:17px}.modal{position:fixed;inset:0;z-index:20;background:rgba(1,4,12,.78);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{width:min(100%,460px);max-height:85vh;overflow:auto;padding:23px}.card h2{margin:0 0 8px;font-size:25px}.card p,.card li{color:#b5c6da;line-height:1.65;font-size:13px}.card ol{padding-left:20px}.close{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#dffaff,#68e4ff);color:#071126;font-weight:900}.result{text-align:center}.result .big{font-size:58px;margin:8px}.result h2{font-size:29px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}.stat{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.06)}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:var(--muted)}@media(max-height:720px){.setup{padding:9px}.opts{display:none}.boardwrap{padding:7px}.controls{margin-top:7px}.ctl{padding:7px 3px}.scorebar{padding:8px 12px}.top{margin-bottom:7px}.logo{width:36px;height:36px}.title{font-size:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style></head><body><div class="stars"></div><main class="app"><header class="top"><div class="brand"><div class="logo"></div><div><div class="title">LUMINA</div><div class="sub">星晶の陣</div></div></div><button class="iconbtn" id="sound" aria-label="サウンド">♪</button></header><section class="panel setup"><div class="seg"><button id="aiBtn" class="on">AI 対戦</button><button id="duoBtn">2人対戦</button></div><div class="opts"><label class="select"><span>AI LEVEL</span><select id="level"><option value="1">EASY</option><option value="2" selected>NORMAL</option><option value="3">HARD</option></select></label><label class="select"><span>MAP</span><select id="map"><option value="0">星環</option><option value="1">十字星</option><option value="2">双月</option></select></label></div></section><section class="panel scorebar"><div class="side"><div class="gem blue"></div><div><div class="pname">蒼月</div><div class="num" id="blueScore">2</div></div></div><div class="turn"><b id="turnText">蒼月の手番</b><span id="moveText">MOVE 01</span></div><div class="side r"><div><div class="pname" id="goldName">金陽 AI</div><div class="num" id="goldScore">2</div></div><div class="gem gold"></div></div></section><section class="panel boardwrap"><div class="board" id="board"></div><div class="flash" id="flash"></div></section><div class="controls"><button class="ctl" id="undo"><span>↶</span>一手戻す</button><button class="ctl" id="hint"><span>✦</span>ヒント</button><button class="ctl" id="rules"><span>?</span>遊び方</button><button class="ctl primary" id="restart"><span>↻</span>新しい対局</button></div><div class="status" id="status">駒を選び、光るマスへ移動</div></main><div class="modal" id="ruleModal"><div class="panel card"><h2>遊び方</h2><p>盤面を自分の光で満たす、短時間型の戦略ゲームです。</p><ol><li>自分の駒をタップします。</li><li><b>隣のマス</b>へ進むと、元の駒を残して増殖します。</li><li><b>2マス先</b>へ進むと、元の駒を消して跳躍します。</li><li>着地した駒の周囲8マスにある敵駒は、すべて味方へ反転します。</li><li>両者が動けないか盤面が埋まると終了。駒が多い側の勝利です。</li></ol><button class="close">対局へ戻る</button></div></div><div class="modal" id="resultModal"><div class="panel card result"><div class="big" id="resultIcon">✦</div><h2 id="resultTitle">勝利</h2><p id="resultText"></p><div class="stats"><div class="stat"><b id="wins">0</b><span>WIN</span></div><div class="stat"><b id="games">0</b><span>GAMES</span></div><div class="stat"><b id="streak">0</b><span>STREAK</span></div></div><button class="close" id="again">もう一度対戦</button></div></div><script>
(()=>{'use strict';const N=7,B=1,G=2,X=-1,MAPS=[[17,31],[9,11,23,25,37,39],[3,21,27,45]],$=s=>document.querySelector(s),boardEl=$('#board'),statusEl=$('#status'),turnEl=$('#turnText'),moveEl=$('#moveText'),bs=$('#blueScore'),gs=$('#goldScore');let board=[],turn=B,selected=-1,mode='ai',busy=false,moveNo=1,history=[],soundOn=true,audio=null,musicTimer=null,stats={wins:0,games:0,streak:0};try{stats=JSON.parse(localStorage.getItem('luminaStats')||JSON.stringify(stats))}catch(e){};function fresh(){board=Array(49).fill(0);board[0]=B;board[48]=B;board[6]=G;board[42]=G;for(const i of MAPS[+$('#map').value])board[i]=X;turn=B;selected=-1;busy=false;moveNo=1;history=[];render();statusEl.textContent='駒を選び、光るマスへ移動';$('#resultModal').classList.remove('show')}function xy(i){return[i%N,(i/N)|0]}function dist(a,b){const[x,y]=xy(a),[u,v]=xy(b);return Math.max(Math.abs(x-u),Math.abs(y-v))}function moves(p,b=board){const out=[];for(let i=0;i<49;i++)if(b[i]===p){const[x,y]=xy(i);for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),u=x+dx,v=y+dy,j=v*N+u;if(d&&d<=2&&u>=0&&u<N&&v>=0&&v<N&&b[j]===0)out.push([i,j,d])}}return out}function legalFrom(i){return moves(turn).filter(m=>m[0]===i)}function apply(m,b=board,p=turn){const[a,z,d]=m,n=b.slice();if(d===2)n[a]=0;n[z]=p;const[x,y]=xy(z);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const u=x+dx,v=y+dy,j=v*N+u;if(u>=0&&u<N&&v>=0&&v<N&&n[j]>0&&n[j]!==p)n[j]=p}return n}function count(p,b=board){return b.reduce((n,v)=>n+(v===p),0)}function render(){boardEl.innerHTML='';const legal=selected>=0?legalFrom(selected):[];for(let i=0;i<49;i++){const c=document.createElement('button');c.className='cell';c.dataset.i=i;if(board[i]===X)c.classList.add('block');if(i===selected)c.classList.add('selected');const m=legal.find(x=>x[1]===i);if(m)c.classList.add('legal',m[2]===2?'jump':'clone');if(board[i]>0){const p=document.createElement('i');p.className='piece '+(board[i]===B?'b':'g');c.append(p)}c.onclick=()=>tap(i);boardEl.append(c)}bs.textContent=count(B);gs.textContent=count(G);turnEl.textContent=(turn===B?'蒼月':'金陽')+'の手番';moveEl.textContent='MOVE '+String(moveNo).padStart(2,'0');$('#goldName').textContent=mode==='ai'?'金陽 AI':'金陽';$('#undo').disabled=!history.length||busy;$('#hint').disabled=busy||turn===G&&mode==='ai'}function tap(i){wake();if(busy||board[i]===X)return;if(selected>=0){const m=legalFrom(selected).find(x=>x[1]===i);if(m){doMove(m);return}}if(board[i]===turn){selected=selected===i?-1:i;tone(520,.045,'sine',.035);render()}else{selected=-1;render()}}function doMove(m){history.push({board:board.slice(),turn,moveNo});board=apply(m);selected=-1;sparks(m[1],turn);tone(m[2]===1?760:430,.1,m[2]===1?'triangle':'sine',.07);setTimeout(()=>tone(980,.08,'sine',.035),60);turn=turn===B?G:B;moveNo++;render();next()}function next(){const cur=moves(turn);const other=moves(turn===B?G:B);if(!cur.length){if(!other.length||!board.includes(0)){finish();return}statusEl.textContent=(turn===B?'蒼月':'金陽')+'は動けないためパス';turn=turn===B?G:B;moveNo++;render();setTimeout(next,500);return}if(!board.includes(0)){finish();return}if(mode==='ai'&&turn===G){busy=true;turnEl.classList.add('thinking');statusEl.textContent='AIが星の流れを読んでいます';render();setTimeout(aiMove,280)}else statusEl.textContent='駒を選び、光るマスへ移動'}function evalBoard(b,p){const o=p===B?G:B;let s=(count(p,b)-count(o,b))*12+(moves(p,b).length-moves(o,b).length)*.7;for(let i=0;i<49;i++)if(b[i]===p){const[x,y]=xy(i);if((x===0||x===6)&&(y===0||y===6))s+=3;if(x===0||x===6||y===0||y===6)s+=.8}return s}function aiMove(){const ms=moves(G);let pick=ms[(Math.random()*ms.length)|0],lvl=+$('#level').value;if(lvl>1){let best=-1e9;for(const m of ms){const b=apply(m,board,G);let v=evalBoard(b,G);if(lvl===3){const replies=moves(B,b);if(replies.length){let worst=1e9;for(const r of replies){const b2=apply(r,b,B);let rv=evalBoard(b2,G);const coun=moves(G,b2);if(coun.length){let mx=-1e9;for(const q of coun)mx=Math.max(mx,evalBoard(apply(q,b2,G),G));rv=rv*.55+mx*.45}worst=Math.min(worst,rv)}v=v*.45+worst*.55}}v+=Math.random()*(lvl===2?4:.08);if(v>best){best=v;pick=m}}}busy=false;turnEl.classList.remove('thinking');doMove(pick)}function undo(){if(!history.length)return;let h=history.pop();if(mode==='ai'&&h.turn===G&&history.length)h=history.pop();board=h.board;turn=h.turn;moveNo=h.moveNo;selected=-1;busy=false;turnEl.classList.remove('thinking');tone(300,.08,'sine',.05);render();statusEl.textContent='一手戻しました'}function hint(){const ms=moves(turn);if(!ms.length)return;let best=ms[0],v=-1e9;for(const m of ms){const q=evalBoard(apply(m),turn);if(q>v){v=q;best=m}}selected=best[0];render();const el=boardEl.children[best[1]];el.classList.add('hint');statusEl.textContent='白く光るマスがおすすめ';tone(880,.13,'triangle',.05)}function finish(){busy=false;const b=count(B),g=count(G),win=b>g,draw=b===g;stats.games++;if(mode==='ai'){if(win){stats.wins++;stats.streak++}else stats.streak=0}try{localStorage.setItem('luminaStats',JSON.stringify(stats))}catch(e){};$('#wins').textContent=stats.wins;$('#games').textContent=stats.games;$('#streak').textContent=stats.streak;$('#resultIcon').textContent=draw?'◇':win?'✦':'◆';$('#resultTitle').textContent=draw?'引き分け':win?'蒼月の勝利':'金陽の勝利';$('#resultText').textContent=`最終スコア　蒼月 ${b} — ${g} 金陽`;$('#resultModal').classList.add('show');tone(win?1040:260,.35,win?'triangle':'sine',.08);if(win)setTimeout(()=>tone(1320,.45,'sine',.05),120)}function sparks(i,p){const r=boardEl.children[i].getBoundingClientRect(),f=$('#flash').getBoundingClientRect(),cx=r.left-f.left+r.width/2,cy=r.top-f.top+r.height/2;for(let k=0;k<14;k++){const s=document.createElement('i'),a=Math.random()*Math.PI*2,d=25+Math.random()*55;s.className='spark';s.style.left=cx+'px';s.style.top=cy+'px';s.style.color=p===B?'#42d8ff':'#ffb84d';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');$('#flash').append(s);setTimeout(()=>s.remove(),700)}}function wake(){if(!soundOn)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!musicTimer){musicTimer=setInterval(()=>{if(!soundOn||!audio)return;const n=[174,220,261,329][(Date.now()/2400|0)%4];tone(n,1.7,'sine',.008)},2400)}}function tone(freq,d,type='sine',vol=.04){if(!soundOn)return;wake();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(vol,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d+.03)}$('#aiBtn').onclick=()=>{mode='ai';$('#aiBtn').classList.add('on');$('#duoBtn').classList.remove('on');fresh()};$('#duoBtn').onclick=()=>{mode='duo';$('#duoBtn').classList.add('on');$('#aiBtn').classList.remove('on');fresh()};$('#map').onchange=fresh;$('#restart').onclick=fresh;$('#undo').onclick=undo;$('#hint').onclick=hint;$('#rules').onclick=()=>$('#ruleModal').classList.add('show');$('#ruleModal .close').onclick=()=>$('#ruleModal').classList.remove('show');$('#again').onclick=fresh;$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'♪':'×';if(soundOn){wake();tone(700,.08)}else if(audio)audio.suspend()};document.addEventListener('visibilitychange',()=>{if(audio&&document.hidden)audio.suspend()});fresh()})();
</script></body></html>
